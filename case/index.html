<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>价格鉴证案例分析 · 刷题</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --fg:#1b2430; --sub:#6b7a8d; --line:#e3e8ef;
  --ok:#0f7a55; --okbg:#e6f6ef; --bad:#c0392b; --badbg:#fdecea;
  --pri:#2f6fed; --pril:#eaf1fe; --warnfg:#8a5a00; --warnbg:#fff4dc;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#11151b; --card:#191f27; --fg:#e5eaf1; --sub:#93a1b3; --line:#2a323d;
    --ok:#3ed598; --okbg:#12312a; --bad:#ff8078; --badbg:#3a1e1c;
    --pri:#6ea8ff; --pril:#1c2740; --warnfg:#ffce6b; --warnbg:#3a2f14; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ttl{font-weight:700;font-size:15px}
.stat{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
select{font:13px/1 inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px;max-width:46vw}
.chip{font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--sub);
  border-radius:999px;padding:5px 11px;cursor:pointer;user-select:none;white-space:nowrap}
.chip.on{background:var(--pril);border-color:var(--pri);color:var(--pri);font-weight:600}
main{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{font-size:11.5px;color:var(--sub);background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:2px 7px}
.tag.warn{color:var(--warnfg);background:var(--warnbg);border-color:transparent}
.idx{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.stem{font-size:16.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:var(--bg);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;
  color:var(--fg);font:inherit;line-height:1.65;transition:.12s}
.opt:active{transform:scale(.995)}
.opt b{flex:0 0 22px;height:22px;line-height:22px;text-align:center;border-radius:7px;font-size:13px;
  background:var(--card);border:1px solid var(--line);color:var(--sub)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--pri);background:var(--pril)}
.opt.sel b{background:var(--pri);border-color:var(--pri);color:#fff}
.submit{margin-top:14px;width:100%;font:15px/1 inherit;padding:13px 6px;border-radius:11px;
  border:1px solid var(--pri);background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
.submit[disabled]{opacity:.5;cursor:default;border-color:var(--line);background:var(--bg);
  color:var(--sub);font-weight:400}
.exp{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;font-size:14.5px;
  line-height:1.85;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.exp .ans{font-weight:700;margin-bottom:6px}
.exp .ans.ok{color:var(--ok)}
.exp .ans.bad{color:var(--bad)}
.exp .lbl{color:var(--sub);font-size:12.5px;margin-bottom:4px;letter-spacing:.04em}
.empty{color:var(--sub);text-align:center;padding:48px 12px;font-size:14px}
footer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);
  border-top:1px solid var(--line);display:flex;gap:8px;padding:9px 10px;
  padding-bottom:calc(9px + env(safe-area-inset-bottom))}
footer button{flex:1;font:15px/1 inherit;padding:12px 6px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);cursor:pointer}
footer button:active{transform:scale(.98)}
#fav{flex:0 0 56px;font-size:18px}
#fav.on{color:#f5a623;border-color:#f5a623}
#next{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;
  align-items:flex-end;justify-content:center}
.overlay.hide{display:none}
.panel{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;
  max-height:82vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);
  font-weight:600;font-size:15px}
.ph .stat{font-weight:400}
.ph button{margin-left:auto;background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;
  padding:12px 14px 20px;overflow:auto;overflow-y:auto}
.grid button{aspect-ratio:1/1;border-radius:9px;border:1px solid var(--line);background:var(--bg);
  color:var(--sub);font:13px/1 inherit;cursor:pointer;font-variant-numeric:tabular-nums}
.grid button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.grid button.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:600}
.grid button.cur{outline:2px solid var(--pri);outline-offset:1px}
.grid button.fav::after{content:"";}
.grid button.fav{border-color:#f5a623}
.legend{display:flex;gap:12px;padding:0 14px 10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}

.ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.hist{font-size:12.5px;color:var(--sub);margin-top:10px;font-variant-numeric:tabular-nums}
.hist .ok{color:var(--ok)}
.redo{display:block;margin-top:12px;font:14px/1 inherit;padding:10px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.redo:active{transform:scale(.98)}
.tpanel{padding:14px 14px 20px;overflow:auto}
.sec{margin-bottom:18px}
.sec h4{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.kv div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.5}
.kv em{font-style:normal;font-size:11.5px;color:var(--sub)}
.bars{display:flex;gap:6px;align-items:flex-end;height:108px;padding-top:4px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;gap:4px}
.btrack{position:relative;flex:1;width:100%;background:var(--bg);border-radius:5px;overflow:hidden}
.bwrap{position:absolute;left:0;right:0;bottom:0;background:var(--pri);border-radius:5px;
  display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.bwrap i{display:block;width:100%;background:var(--bad)}
.bcol em{font-style:normal;font-size:10.5px;color:var(--sub)}
.bcol span{font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:8px;font-size:13px}
.row .nm{flex:0 0 36%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.row .tr{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.row .tr i{display:block;height:100%;background:var(--pri)}
.row .tr.w i{background:var(--bad)}
.row .vl{flex:0 0 auto;min-width:78px;text-align:right;font-size:12px;color:var(--sub);
  font-variant-numeric:tabular-nums}
.tbtn{display:block;width:100%;text-align:left;font:14px/1.5 inherit;padding:11px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;margin-bottom:8px}
.tbtn:active{transform:scale(.99)}
.tbtn.danger{border-color:var(--bad);color:var(--bad)}
.tbtn small{color:var(--sub);font-size:11.5px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
  background:rgba(20,24,30,.88);color:#fff;font-size:13px;line-height:1.6;padding:9px 14px;
  border-radius:10px;max-width:82vw;text-align:center}
/* ---- 新增：重做 / 统计 / 面板 ---- */
.chip.warnbtn{color:var(--bad);border-color:var(--bad)}
.tag.redo{color:var(--pri);background:var(--pril);border-color:transparent}
.hist{margin-top:12px;font-size:12.5px;line-height:1.7;color:var(--sub);
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.hist b{color:var(--pri)}
.redoBtn{margin-top:12px;width:100%;font:14px/1 inherit;padding:11px 6px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.redoBtn:active{transform:scale(.99)}
.tabs{display:flex;gap:6px;padding:10px 14px 0}
.tabs button{flex:1;font:14px/1 inherit;padding:9px 6px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--pril);border-color:var(--pri);color:var(--pri);font-weight:600}
.pane{overflow:auto;overscroll-behavior:contain}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;padding:12px 14px 0}
.cell{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.cell .n{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.cell .n small{font-size:12px;font-weight:400;color:var(--sub)}
.cell .l{font-size:12px;color:var(--sub);margin-top:2px}
.prog{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;
  overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--pri)}
.sec{padding:16px 14px 0;font-size:12.5px;color:var(--sub);font-weight:600;letter-spacing:.05em}
.bars{display:flex;gap:7px;padding:8px 14px 0;align-items:stretch}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bar b{font-size:10.5px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.bar .track{width:100%;height:82px;display:flex;align-items:flex-end;background:var(--bg);
  border:1px solid var(--line);border-radius:7px;overflow:hidden}
.bar .track i{display:block;width:100%;background:var(--pri);opacity:.85}
.bar .barlab{font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.tb{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.tb td{padding:7px 2px;border-bottom:1px solid var(--line)}
.tb td:last-child{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.tb tr:last-child td{border-bottom:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:16px 14px 4px}
.acts button{flex:1;min-width:96px;font:13.5px/1 inherit;padding:11px 6px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.acts button.danger{color:var(--bad);border-color:var(--bad)}
.pad{padding:12px 14px 0;font-size:12.5px;color:var(--sub);line-height:1.7}
.hide{display:none}
</style>

<body>

<header>
  <div class="hrow">
    <div class="ttl" id="hdTitle">价格鉴证案例分析</div>
    <div class="stat" id="hdStat">—</div>
  </div>
  <div class="filters">
    <select id="selPart">
      <option>全部</option><option>历年真题</option><option>章节题库</option><option>模拟试题</option><option>押题卷</option>
    </select>
    <select id="selYear"><option value="">全部年份</option></select>
    <select id="selChap"><option value="">全部章节</option></select>
    <select id="selTime">
      <option value="">全部时间</option>
      <option value="1">今天</option>
      <option value="3">近 3 天</option>
      <option value="7">近 7 天</option>
      <option value="30">近 30 天</option>

    <span class="chip" id="cWrong">只看错题</span>
    <span class="chip" id="cFav">只看收藏</span>
    <span class="chip" id="cShuf">随机顺序</span>
    <span class="chip" id="cAuto">答完自动下一题</span>
    <span class="chip" id="cRedo">重做本范围</span>

<main><div id="app"></div></main>

<footer>
  <button id="prev">上一题</button>
  <button id="fav" title="收藏">☆</button>

  <button id="next">下一题</button>
</footer>

<div class="overlay hide" id="panelOv">
  <div class="panel">
    <div class="ph"><span id="panelTitle">面板</span> <span class="stat" id="panelStat"></span><button id="panelClose">✕</button></div>
    <div class="tabs">
      <button id="tabSheet" class="on">答题卡</button>
      <button id="tabStat">统计 / 备份</button>
    </div>
    <div class="pane" id="paneSheet">
      <div class="legend">
        <span><i class="dot" style="background:var(--okbg);border:1px solid var(--ok)"></i>答对</span>
        <span><i class="dot" style="background:var(--badbg);border:1px solid var(--bad)"></i>答错</span>
        <span><i class="dot" style="background:#f5a623"></i>收藏</span>
        <span><i class="dot" style="background:var(--bg);border:1px solid var(--line)"></i>未做</span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="pane hide" id="paneStat"></div>
  </div>
</div>

－22]＝ 219.29 万元人民币\n9 ．实体性贬值＝ 1097.80×5÷25×100% ＝ 219.56 万元人民币\n10 ．价格鉴证值＝ 1097.80 － 219.56 ＝ 878.24 万人民币价格鉴证人员根据上述结果，撰写了价格鉴证结论书，其中声明一项明确指出：若委托方对此结论有异议，可于结论书送达之日起在规定的时间内向国家发展和改革委员会价格鉴证机构提出复核。\nXX 市价格鉴证机构按照国家规范的文书格式出具了价格鉴证结论书，分别送达甲乙双方。甲方阅读价格鉴证结论书后，认为价格鉴证值明显偏低，直接向\nXX 省价格鉴证机构提出了复核申请， XX 省价格鉴证机构按照政策驳回了甲方的申请。","opts":[],"ans":"（ 1 ）价格鉴证基准日确认错误，价格鉴证基准日是价格鉴证\n结论对应的年、月、日，应为 2018 年 11 月 11 日。\n（ 2 ）标的的到岸价格计算错误，到岸价格每年上涨 2% ，因此应\n改为：到岸价格＝ 130× （ 1 ＋ 2% ）3＝ 137.96 （万美元）。\n（ 3 ）标的到岸人民币价格计算错误，应改为价格鉴证基准日的人\n民币对美元的汇率。\n（ 4 ）增值税计算错误，应以到岸人民币价格和进口关税之和为基\n数。\n（ 5 ）国内运杂费计算错误，计算基数中缺少银行手续费。\n（ 6 ）功能性贬值计算错误，应扣减企业所得税。\n（ 7 ）实体性贬值计算中已使用年限确认错误，从 2015 年 11 月 11 日\n引进到价格鉴证基准日 2018 年 11 月 11 日，已使用年限应为 3 年。\n（ 8 ）价格鉴证值计算错误，还应减掉功能性贬值，价格鉴证值＝\n重置成本－功能性贬值－实体性贬值。\n（ 9 ）价格鉴证结论书中声明一项书写错误，应改为 “ 向 XX 省价价\n格鉴证机构提出复核。 ”\n（ 10 ）价格鉴证结论书送达错误，应送达给 XX 市中级人民法院。\n（ 11 ）甲方向 XX 省价格鉴证机构提出复核申请错误，应向 XX 市\n中级人民法院提出复核申请。","exp":"","stale":false},{"id":357,"part":"历年真题","src":"2019年","year":"2019","chap":"","qtype":"short","stem":"3 ．三、根据给出的价格鉴证材料，采用适当的方法对价格鉴证标的的价格进行鉴证。（ 20 分）答题要求：\n1 ．计算步骤清晰，要求列出计算过程、计算公式，不能只写结果；\n2 ．计算结果，保留两位小数，价格单位：万元。\nXX 写字楼，位于 XX 路： XX 号，为高层框架结构，建筑面积\n15000 平方米，土地和写字楼开发共用二年，土地为有偿取得，使用年限为 40 年，于 2018 年 10 月 1 日竣工并投入使用。\nXX 市价格鉴证机构在大量的交易实例中选取了同一区位的三个比较案例。具体情况见表 1 ：表 1 可比实例情况表注：其他情况相同，忽略不计。因基准日前半年内本市房地产价格没有较大变化，交易情况都正常，故交易时间和交易情况均不作修正。根据区域因素和个别因素对价格鉴证影响的大小，确认在本案中区域因素和个别因素对价格鉴证值的修正系数如表 2 ：表 2 修正系数表请采用简单算术平均法确定 XX 写字楼的鉴证价格是多少？","opts":[],"ans":"（ 1 ）计算可比实例 1 的比准价格：\n9300× （ 100/100 ） × （ 100/100 ） × （ 100/96 ） × （ 100/100 ）＝\n9687.50 （元 / 米2）\n（ 2 ）计算可比实例 2 的比准价格：\n9500× （ 100/100 ） × （ 100/100 ） × （ 100/100 ） × （ 100/92 ）＝\n10326.09 （元 / 米2）\n（ 3 ）计算可比实例 3 的比准价格：\n9800× （ 100/100 ） × （ 100/100 ） × （ 100/100 ） × （ 100/98 ）＝\n10000.00 （米 / 米2）\n（ 4 ）用简单算术平均法确定比准单价：\n比准单价＝（ 9687.50 ＋ 10326.09 ＋ 10000.00 ） ÷3 ＝ 10004.53 （元 /\n米2）\n（ 5 ）确定 XX 写字楼的鉴证价格：\n鉴证价格＝ 10004.53×15000 ＝ 15006.80 （万元）","exp":"","stale":false},{"id":358,"part":"历年真题","src":"2019年","year":"2019","chap":"","qtype":"short","stem":"4 ．四、根据给出的价格鉴证材料，采用适当的方法对价格鉴证标的价格进行鉴证。（ 20 分）答题要求：\n1 ．计算步骤清晰，要求列出计算过程、计算公式，不能只写结果；\n2 ．计算结果，保留两位小数，价格单位：万元。\nA 企业以其专有技术与 B 企业合作经营。该专有技术的重置成本为\n600 万元， B 企业投入的资产重置成本为 9000 万元， A 企业无形资产成本利润率为 400% ， B 企业投入资产的成本利润率为 15% 。经测算，该专有技术的寿命期限为 30 年，每年的合营纯收益额为 3000 万元，折现率为 8% 。试根据这些资料，求 A 企业的无形资产收益现值。","opts":[],"ans":"（ 1 ）计算 A 企业无形资产约当投资量\n无形资产约当投资量＝无形资产重置成本 × （ 1 ＋适用成本利润\n率）＝ 600× （ 1 ＋ 400% ）＝ 3000 （万元）\n（ 2 ）计算 B 企业合营资产约当投资量\n无形资产约当投资量＝无形资产重置成本 × （ 1 ＋适用成本利润\n率）＝ 9000× （ 1 ＋ 15% ）＝ 10350 （万元）\n（ 3 ）计算 A 企业投资无形资产的利润分成率\n利润分成率＝ ∑ 追加利润现值 /∑ 利润总额现值 ×100% ＝\n3000÷ （ 3000 ＋ 10350 ）＝ 22.47%\n（ 4 ）计算 AB 合营企业收益现值\n3000/8%×[1 － 1/ （ 1 ＋ 8% ）30]＝ 33773.35 （万元）\n（ 5 ）计算 A 企业无形资产收益现值\n无形资产收益现值＝企业收益现值 × 无形资产分成率＝\n33773.35×22.47% ＝ 7588.87 （万元）","exp":"","stale":false},{"id":359,"part":"历年真题","src":"2017年","year":"2017","chap":"","qtype":"short","stem":"1 ．一、根据给出的价格鉴证资料，简要回答问题。（ 20 分）\n2017 年 4 月 10 日， A 市公安局抓获一名盗窃犯罪嫌疑人，追缴了一件标有清乾隆年间字样的青花瓷瓶（已鉴定为真品且不属于三级以上文物）。 2017 年 4 月 15 日，公安机关办案人员携带价格鉴证委托书和被盗瓷器到该市价格认证中心委托价格鉴证。该市价格认证中心接到价格鉴证委托书后当日进行了受理登记，并指派两名价格鉴证人员进行鉴证。鉴证人员按程序对被盗瓷器进行了实物勘验，并查询了当地多家古玩市场的瓷器价格，选取了三个与被盗瓷器风格相近似瓷器的市场交易价格，取算术平均值作为鉴证结论。 2017 年 4 月 29 日，该市价格认证中心领导签发了价格鉴证结论书， 2017 年 4 月 30 日鉴证人员将鉴证结论书送达 A 市公安局。根据以上资料，简要回答下列问题：","opts":[],"ans":"在一般价格鉴证中，完成鉴证的时间由委托方（提出方）和受理方协\n商确定。但在涉刑事案件财物价格认定中，根据《扣押、追缴、没收\n物品估价管理办法》，价格鉴证机构应当在接受价格鉴证提出机关提\n出价格认定事项之日起 7 日内作出价格鉴证结论；另有约定的，在约定\n期限内作出。","exp":"","stale":false,"items":[{"id":359,"q":"1）一般情况下，该市价格认证中心应在几日内出具价格鉴证结论书？","ans":"在一般价格鉴证中，完成鉴证的时间由委托方（提出方）和受理方协\n商确定。但在涉刑事案件财物价格认定中，根据《扣押、追缴、没收\n物品估价管理办法》，价格鉴证机构应当在接受价格鉴证提出机关提\n出价格认定事项之日起 7 日内作出价格鉴证结论；另有约定的，在约定\n期限内作出。","exp":""},{"id":360,"q":"2）价格鉴证结论书的生效日期是哪天？","ans":"对重大复杂的价格鉴证事项，审批人应该提请集体审议后研究确定。\n价格鉴证结论书从审批人签发之日起生效。故价格鉴证结论书的生效\n日期是 2017 年 4 月 29 日。","exp":""},{"id":361,"q":"3）在受理古玩价格鉴证委托时，应特别注意什么？","ans":"一般地说，古玩的估价程序与其他资产估价的程序一样，需经历委托\n受理、鉴定和调查、出具估价结论等阶段。在受理古玩估价委托时，\n应特别注意国家有关文物保护和文物管理法规的约束。","exp":""},{"id":362,"q":"4）价格认证中心对该瓷器进行价格鉴证，可选用哪几种方法？","ans":"价格鉴证方法主要说明价格鉴证采用的方法，一般包括成本\n法、市场法、收益法和专家咨询法。价格认证中心对该瓷器进行价格\n鉴证，可选用市场法、专家咨询法。\n成本法又称重置成本法，是指在进行价格鉴证时，按照价格鉴证\n标的的现时重置成本扣减各种损耗来确定价格鉴证标的价格的方法。\n收益法是指将价格鉴证标的在未来的预期收益，按设定的折现率折算\n成现值，借以确定价格鉴证标的价格的一种方法。成本法和收益法都\n不适用于对古玩文物进行价格鉴证。","exp":""},{"id":363,"q":"5）价格鉴证人员通过选取三个与被盗瓷器风格相近似瓷器的市场交易价格，取算术平均值作为标的鉴证结论的做法是否正确？说明理由。","ans":"不正确。理由如下：如标的瓷器为古玩文物，则与其相近似的参照物\n一般不易找到，通常应参照国有文物商店同类古玩的售价和国内外知\n名的拍卖行近期类似古玩的成交价，以及估价时的社会经济因素状\n况，并充分考虑其交易时间和交易条件等因素，综合确定古玩的价\n格，不能采取简单平均的方法。","exp":""}]},{"id":364,"part":"历年真题","src":"2017年","year":"2017","chap":"","qtype":"short","stem":"2 ．二、根据给出的案例提示找出价格鉴证结论书中的 10 个错误，并简要说明理由。找出的错误超出 10 个的，前 10 个有效，相关错误只算一个错误。（ 20 分）案例提示：\n2015 年 10 月 28 日， A 市公安局破获一起盗窃案件，追缴瑞士江诗丹顿牌腕表一只（已经专业机构鉴定为原装正品），该表系犯罪嫌疑人于 2010 年 5 月 1 日从市民孙某家中盗窃所得。根据孙某报案记录，该腕表为瑞士原装江诗丹顿牌男表，传袭系列， 86060/000R － 9640 ，\n2005 年 1 月 20 日从香港名表行购买，包装附件及购买凭证保存完好。\n2015 年 10 月 31 日， A 市公安局委托 A 市价格认证中心对腕表的价格进行鉴证。 A 市价格认证中心受理后，依法进行了价格鉴证，并于 2015 年\n11 月 15 日出具了如下价格鉴证结论书。关于瑞士原装江诗丹顿牌腕表的价格鉴证结论书\nA 市公安局：根据你局委托，我中心遵循独立、客观、公正的原则，按照规定的标准、程序和方法，依法对你局委托鉴证的瑞士原装江诗丹顿牌腕表进行了价格鉴证。现将价格鉴证情况综述如下：一、价格鉴证标的鉴证标的为瑞士原装江诗丹顿牌腕表，传袭系列， 86060/000R －\n9640 ， 2005 年 1 月 20 日购买，包装附件及购买凭证保存完好。二、价格鉴证基准日\n2015 年 10 月 28 日。三、价格定义价格鉴证结论所指价格是：鉴证标的在价格鉴证基准日，采用公开市场价值标准确定的客观合理的价格。四、价格鉴证依据（一）法律、法规\n1 ．《中华人民共和国价格法》；\n2 ．《 ×× 省涉案财物价格鉴证条例》；\n3 ．国家计委、最高人民法院、最高人民检察院、公安部印发的《扣押、追缴、没收物品估价管理办法》；\n4 ．其他相关法律、法规。\n（二）委托方提供的资料\nA 市公安局 ×× 号价格鉴证委托书。\n（三）鉴证方收集的有关资料\n1 ．实物勘验资料；\n2 ．市场调查资料；\n3 ．专家意见；\n4 ．其他相关资料。五、价格鉴证方法市场法。六、价格鉴证过程接受委托后，我中心成立了价格鉴证工作小组，制定了价格鉴证作业方案，指派 1 名价格鉴证人员于 2015 年 11 月 6 日对鉴证标的进行了实物勘验。并根据价格鉴证程序和原则，通过认真分析和广泛市场调查，确定采用市场法对标的进行价格鉴证。\n1 ．选择腕表鉴证专家根据本省钟表价格鉴证专家库专家资料信息，从中随机选取 3 名专家，分别为某钟表行技术总监、某奢侈品拍卖行业务经理和某钟表行销售代表。\n2 ．专家意见经认真勘验价格鉴证标的，结合腕表的市场价格资料， 3 名专家分别给出 30 万、 27 万、 27 万元人民币的专家意见。\n3 ．分析处理根据专家意见，价格鉴证人员决定采用众数法对专家意见进行分析处理，即：\n（ 30 ＋ 27 ＋ 27 ） ÷3\n4 ．鉴证价格（ 30 ＋ 27 ＋ 27 ） ÷3 ＝ 28 万元（人民币）七、价格鉴证结论价格鉴证标的在价格鉴证基准日的价格为人民币贰拾捌万元整。八、价格鉴证限定条件\n1 ．委托方提供资料客观真实；\n2 ．因实物勘验日与价格鉴证基准日不同，鉴证人员无法通过实物勘验了解标的在鉴证基准日的状况，鉴证基准日标的腕表实物状况以委托方表述为准。九、声明\n1 ．价格鉴证结论受结论书中已说明的限定条件限制；\n2 ．委托方提供资料的真实性由委托方负责；\n3 ．价格鉴证结论仅对本次委托有效，不作他用。未经我中心同意，不得向委托方和有关当事人之外的任何单位和个人提供，结论书的全部或部分内容，不得发表于任何公开媒体上；\n4 ．鉴证机构和鉴证人员与价格鉴证标的没有利害关系，也与有关当事人没有利害关系。十、价格鉴证作业日期\n2015 年 10 月 31 日至 2015 年 11 月 15 日。十一、价格鉴证机构机构名称：（略）机构资质证书号：（略）法定代表人签字：（略）十二、价格鉴证人员十三、附件\n1 ． A 市公安局 ×× 号价格鉴证委托书复印件（略）；\n2 ．价格鉴证机构资质证书复印件（略）；\n3 ．价格鉴证人员资格证书复印件（略）。\nA 市价格认证中心（公章）\n2015 年 11 月 15 日","opts":[],"ans":"（ 1 ）价格鉴证基准日期错误。价格鉴证基准日是说明价格鉴\n证结论对应的年、月、日。该基准日由委托方根据价格鉴证标的涉及\n案件的实际情况确定，该案件涉案时间为 2010 年 5 月 1 日，因此价格鉴\n证基准日应为 2010 年 5 月 1 日；\n（ 2 ）价格鉴证结论书缺少价格鉴证目的；\n（ 3 ）价格鉴证方法错误。本案采用将专家设定为市场潜在购买\n者，利用其知识、经验和分析判断能力对价格鉴证标的进行鉴证的方\n法，应为专家咨询法；\n（ 4 ）实物勘验的价格鉴证人员数量不符合规定。价格评估机构受\n理价格鉴证业务后，应当指派 2 名或者 2 名以上符合岗位条件或具备价\n格评估专业人员资格的人员组成价格鉴证小组，办理价格鉴证事项；\n（ 5 ）运用专家咨询法选择专家，应以 10 人左右为宜，不少于 5\n人；\n（ 6 ）专家意见分析处理方法表述错误，实际上采用的是平均法\n（或算术平均法），不是众数法；\n（ 7 ）价格鉴证结论中缺少小写，或（ ¥280000.00 ）；\n（ 8 ）声明部分缺少异议的处理机制；\n（ 9 ）价格鉴证作业日期超期，涉刑事案件财物价格认定中，根据\n《扣押、追缴、没收物品估价管理办法》，价格鉴证机构应当在接受\n价格鉴证提出机关提出价格认定事项之日起 7 日内作出价格鉴证结论；\n另有约定的，在约定期限内作出；\n（ 10 ）缺少腕表质量检测、检验报告。","exp":"","stale":false},{"id":365,"part":"历年真题","src":"2017年","year":"2017","chap":"","qtype":"short","stem":"3 ．三、指出下列价格鉴证技术报告（片断）中存在的错误，加以改正。并计算出正确结果（因前面错误导致的错误只算一个错误）。\n（ 20 分）某市公安局委托同级价格认证中心对盗窃案中涉案手机价格进行鉴证，鉴证基准日为 2017 年 2 月 20 日。价格认证中心按程序做出了价格鉴证结论书，以下是该结论书技术报告的部分摘录：我中心接受委托后，成立了价格鉴证小组，制订了价格鉴证方案，并指派 2 名价格鉴证人员对涉案手机进行了实物勘验，确定鉴证标的状况如下：华为 P9 64G 型金色手机裸机 1 部，无充电器、数据线及包装等附件；已使用 3 个月；机身磨损一般；使用正常，各功能完好。实物勘验后，价格鉴证人员严格按照国家有关涉案物品价格鉴证的程序、原则，认真分析研究所掌握的资料，并进行了广泛的市场调查。\n1 ．可比实例的选取。我市二手手机市场规模较大，市场活跃，交易实例较易获取，根据标的情况，选择了三个同款型手机的成交实例作为可比实例，可比实例与鉴证标的的情况如表 1 ：表 1 比较因素说明表根据掌握的上述资料，价格鉴证人员决定采用成本法进行价格鉴证，即以鉴证标的各因素为基础，将可比实例的各因素与之相比，通过对各因素进行修正得出鉴证标的价格。\n2 ．比较因素指数的确定。据调查，华为 P9 64G 手机机身颜色陶瓷白价格最高，金次之，玫瑰金价格最低，相邻之间的修正比例为 5% ；二手手机市场零售价与收购价之间的修正比例为 10% ；使用时间修正一般以使用 12 个月为界，修正比例为 10% ；外观情况分为机身磨损较轻、一般、较重三个等级，每相邻等级之间修正比例为 10% ；有无附件的修正比例为 10% 。因交易日期与基准日较近，交易时间不作修正。则比较因素指数表如表 2 ：表 2 比较因素指数表用鉴证标的比较因素指数与可比实例的比较因素指数之比，确定各因素的修正系数，见表 3 ：表 3 比较因素修正系数表实例比准价格计算如下：实例 1 ： 2100× （ 100/95 ） × （ 100/100 ） × （ 100/110 ） × （ 100/110 ）\n× （ 100/90 ）＝ 2232.85 （元）实例 2 ： 1800× （ 100/100 ） × （ 100/100 ） × （ 100/100 ）\n× （ 10 能只写结果；\n2 ．计算过程、结果保留两位小数，金额单位万元。第 2 题某公司拟将一已经使用 30 年的注册商标转让。根据历史资料，该公司近 10 年使用这一商标的产品比同类产品的价格每件高 1 元，每年生产 100 万件。该商标目前在市场上趋势较好，生产产品基本上供不应求。据行业内专家预测，在生产能力足够的情况下，这种商标的产品未来每年可销售 200 万件，每件获超额利润 0.50 元，预计该商标产品能够继续获取超额利润的时间为 20 年，前 5 年保持目前超额利润水平，以后每年可获取的超额利润为目前的 80% 。据调查，目前 1 年期国债年利率为 2.8% ， 1 年期银行贷款年利率为 4.8% ，该行业风险报酬率为5.2% 。假定被转让公司生产能力足够。请根据以上资料，对该项商标权转让价格进行鉴证。","opts":[],"ans":"（ 1 ）计算前 5 年中每年的超额利润\n超额利润＝销售量 × 每件超额利润＝ 200×0.50 ＝ 100 （万元）\n（ 2 ）计算后 15 年中每年的超额利润\n超额利润＝ 100×80% ＝ 80 （万元）\n（ 3 ）计算折现率\n折现率＝无风险利率＋行业风险报酬率＝ 2.8% ＋ 5.2% ＝ 8%\n（ 4 ）计算该项商标权转让价格\n前 5 年超额利润折现值＝ 100×1/8%×[1 － 1/ （ 1 ＋ 8% ）5]＝\n399.27 （万元）\n后 15 年超额利润折现值＝ 80×1/8%×[1 － 1/ （ 1 ＋ 8% ）15]×1/ （ 1 ＋\n8% ）5＝ 466.03 （万元）\n转让价格＝ 399.27 ＋ 466.03 ＝ 865.30 （万元）","exp":"","stale":false},{"id":368,"part":"历年真题","src":"2015年","year":"2015","chap":"","qtype":"short","stem":"1 ．一、根据给出的价格鉴证资料，简要回答问题。（ 20 分）\n2011 年 12 月 14 日， ×× 市发生一起盗窃案，收藏爱好者陈某家中丢失了一幅清光绪年间的花鸟写意画。 2012 年 1 月 11 日该市公安局将犯罪嫌疑人抓获，并将被盗花鸟写意画追回。 2012 年 1 月 12 日，公安机关办案人员携带价格鉴证委托书和花鸟写意画到该市价格认证中心委托价格鉴证。该市价格认证中心受理委托后，价格鉴证人员按程序对被盗花鸟写意画进行了实物勘验，并聘请了十位书画专家进行了价格咨询，取专家建议价格的算术平均值作为价格鉴证结论。 2012 年 1 月 18\n日，经该市价格认证中心领导签发，出具了价格鉴证结论书。 2012 年 1\n月 19 日，价格鉴证人员将价格鉴证结论书送达该市公安局。根据以上资料，简要回答下列问题：","opts":[],"ans":"价格鉴证基准日是为求取鉴证标的某时点上的价格而确定的基准时\n间，即表明所鉴证的是该标的在这一时点上的价格。基准日由委托方\n根据价格鉴证标的涉及案件的实际情况确定。本案的价格基准日应为\n2011 年 12 月 14 日。","exp":"","stale":false,"items":[{"id":368,"q":"1）本案的价格鉴证基准日是哪天？","ans":"价格鉴证基准日是为求取鉴证标的某时点上的价格而确定的基准时\n间，即表明所鉴证的是该标的在这一时点上的价格。基准日由委托方\n根据价格鉴证标的涉及案件的实际情况确定。本案的价格基准日应为\n2011 年 12 月 14 日。","exp":""},{"id":369,"q":"2）正常情况下，该市价格认证中心应在几日内出具价格鉴证结论书？","ans":"在涉刑事案件财物价格认定中，根据《扣押、追缴、没收物品估价管\n理办法》，价格鉴证机构应当在接受价格鉴证提出机关提出价格认定\n事项之日起 7 日内作出价格鉴证结论。","exp":""},{"id":370,"q":"3）在受理古玩价格鉴证委托时，应特别注意什么？","ans":"在受理古玩价格鉴证委托时，应特别注意国家有关文物保护和文物管\n理法规的约束。","exp":""},{"id":371,"q":"4）古玩价格鉴证的操作步骤有哪些？","ans":"古玩价格鉴证的操作步骤：①鉴别古玩的真伪；②鉴定古玩的年代；\n③鉴定古玩的完好性；④鉴定古玩的艺术价值；⑤鉴定古玩的科学价\n值；⑥参照国有文物商店同类古玩的售价和国内外知名的拍卖行近期\n类似古玩的成交价格，以及价格鉴证时的社会经济因素，确定古玩的\n鉴证价格。","exp":""},{"id":372,"q":"5）价格鉴证结论书的生效日期是哪天？","a ","stem":"4 ．四、计算题。根据给出的背景材料，采用适当的方法对价格鉴证标的价格进行计算。（共 2 题，合计 40 分）答题要求：\n1 ．计算步骤清晰，要求列出计算式，不能只写结果；\n2 ．计算结果保留两位小数。第一题金额单位用元表示；第二题金额单位用万元表示。第一题（ 20 分）某果园占用集体土地 82 亩，种植果树 3000 株，果树的剩余收益期为 18 年，前 10 年果树进入盛产期，后 8 年转入丰产期，果园剩余承包期与果树剩余收益期相同。 2007 年 1 月 1 日发生经济纠纷，法院在办理该案件过程中，需对 2007 年 1 月 1 日该果园的价值进行鉴证。据调查和预测，当地该类果园的有效种植株数为 2900 株，盛产期果园一般年产值为每株平均 100 元，丰产期果园一般年产值为每株平均 90 元，果园在产果期正常经营所需的费用平均占年产值的 30% ，果树收益期投资回报率为 10% 。试根据所给资料鉴证该果园在价格鉴证基准日的价值。","opts":[],"ans":"1．由于果园的收益期还有 18 年，收益期较长，且年收益在未\n来连续获得，比较稳定，可将果园的客观纯收益按一定的折现率折\n现，故采取收益法计算该果园的鉴证价格。\n2 ．根据公式分两段进行计算\n前 10 年的盛产期的年收益＝ 100×2900× （ 1 － 30% ）＝\n203000 （元）；\n后 8 年丰产期的年收益＝ 90×2900× （ 1 － 30% ）＝ 182700 （元）。\n（ 1 ）盛产期年价值＝（ 203000÷10% ） ×[1 － 1/ （ 1 ＋ 10% ）10]＝\n1247347.12 （元）；\n或：盛产期年价值＝ 203000× （ P/A ， 10% ， 10 ）＝\n1247347.12 （元）。\n（ 2 ）丰产期年价值＝（ 182700÷10% ） ×[1 － 1/ （ 1 ＋ 10% ）8]÷ （ 1\n＋ 10% ）10＝ 375785.58 （元）；\n或：丰产期年价值＝ 182700× （ P/A ， 10% ， 8 ） × （ P/F ， 10% ，\n10 ）＝ 375785.58 （元）。\n（ 3 ）果园价值＝盛产期价值＋丰产期价值＝ 1247347.12 ＋\n375785.58 ＝ 1623132.70 （元）。","exp":"","stale":false},{"id":403,"part":"历年真题","src":"2007年","year":"2007","chap":"","qtype":"short","stem":"4 ．四、计算题。根据给出的背景材料，采用适当的方法对价格鉴证标的价格进行计算。（共 2 题，合计 40 分）答题要求：\n1 ．计算步骤清晰，要求列出计算式，不能只写结果；\n2 ．计算结果保留两位小数。第一题金额单位用元表示；第二题金额单位用万元表示。第二题（ 20 分）用市场法对某房地产进行价格鉴证，经收集资料，可比交易实例 A的成交总价为 272 万元人民币，分两期支付，首期支付 80 万元，余额192 万元，在四年内分 48 期付清，自首付后每月支付 4 万元。使用面积为 300 平方米，人民币贷款月利率为 0.5% ，该房产建筑面积与使用面积的比例为 1:0.75 。其区域因素及个别因素情况如下表：假定交易情况修正系数及交易时间修正系数均为 1 ，请根据所给数据计算可比交易实例 A 比准单价（以建筑面积为准）。","opts":[],"ans":"1．区域因素的修正系数为各项目比例的乘积，即：\n同理可得：个别因素的修正系数＝ 1.095 。\n2 ．每月支付 4 万元，贷款月利率为 0.5% ，将月利率作为折现率，\n则：\n可比交易实例 A 的折现值＝ 80 ＋（ 4÷0.5% ） ×[1 － 1/ （ 1 ＋ 0.5% ）48]\n＝ 250.32 （万元）；\n或： A 的折现值＝ 80 ＋ 4× （ P/A ， 0.5% ， 48 ）＝ 250.32 （万元）。\n3 ．利用使用面积可以求出建筑面积＝ 300/0.75 ＝ 400 （平方米）。\n4 ． A 的鉴证单价＝ 250.32/400 ＝ 0.6258 （万元 / 平方米）＝\n6258 （元 / 平方米）；\nA 比准单价＝鉴证单价 × 交易情况修正系数 × 交易时间修正系数 × 区\n域因素修正系数 × 个别因素修正系数＝ 6258×1×1×1.077×1.095 ＝\n7380.15 （元 / 平方米）。","exp":"","stale":false},{"id":404,"part":"历年真题","src":"2006年","year":"2006","chap":"","qtype":"short","stem":"1 ．一、根据给出的价格鉴证资料，简要回答下面的问题。（ 20 分）\n2005 年 10 月 10 日，某公安机关破获了一个盗窃团伙，收缴了一台笔记本电脑，这台笔记本电脑是该团伙在 2004 年 5 月至 2005 年 7 月期间盗窃的。该公安机关将这台笔记本电脑委托县价格认证中心进行价格鉴证。委托书上写明了笔记本电脑的规格型号，鉴证基准日为 2005 年 9\n月 10 日，并附有原始购置发票。县价格认证中心受理后，以原购置价为重置成本，确定其综合成新率后计算出了鉴证值。并于 2005 年 10 月\n15 日出具价格鉴证结论书送达了委托方，委托方即送达当事人，当事人认可该鉴证结论。某检察机关审查案件时，对价格鉴证结论有异议，于是到县价格认证中心的档案室，凭正式查阅函件，取走了价格鉴证文书档案，阅后在规定的时间内送还，并于 2005 年 10 月 25 日向省价格认证中心提出了复核裁定申请（附有必要的资料）。省价格认证中心以当事人未提出异议为由，拒绝受理复核裁定申请。请根据上述资料回答下列问题：","opts":[],"ans":"公安机关的委托事项中存在错误。对鉴证基准日的确定有误，案例中\n的价格鉴证基准日应为被盗日，即 2004 年 5 月至 2005 年 7 月之间的某个\n日期。","exp":"","stale":false,"items":[{"id":404,"q":"1）公安机关委托事项中是否有错误？为什么？","ans":"公安机关的委托事项中存在错误。对鉴证基准日的确定有误，案例中\n的价格鉴证基准日应为被盗日，即 2004 年 5 月至 2005 年 7 月之间的某个\n日期。","exp":""},{"id":405,"q":"2）县价格认证中心进行价格鉴证时，鉴证测算是否恰当？为什么？","ans":"县价格认证中心进行价格鉴证时的鉴证测算不恰当，不应以原购置价\n为重置成本，重置成本应是重新建造、制造，或在现行市场上重新购\n置全新状态下的财物的成本。","exp":""},{"id":406,"q":"3）县价格认证中心在档案管理中有何漏洞？","ans":"该案例中的档案管理太过于随意，未经批准，未写借据借出，不符合\n价格鉴证文书档案管理要求。人民法院、人民检察院和有关国家机关\n因工作需要查阅价格鉴证档案的，须出具正式函件说明查阅原因，经\n价格鉴证机构负责人批准，办理查阅登记手续。因特殊情况需要将价\n格鉴证档案借出的，须经价格鉴证机构负责人同意，并报主管部门批\n准后方可借出，并由档案管理人员清点档案页数，交代借阅期限和注\n意事项，再由借阅人员写出正式的借据。","exp":""},{"id":407,"q":"4）省价格认证中心是否应当拒绝受理检察院的复核裁定申请？为什么？","ans":"省价格认证中心不应当拒绝受理检察院的复核裁定申请。《涉案物品\n价格鉴证复核裁定管理办法》规定：行政、司法机关对价格认证中心\n出具的涉案财物价格鉴证结论提出异议的，可向原价格鉴证单位提出\n补充鉴证或者重新鉴证，也可以直接向其上级政府价格主管部门设立\n的复核裁定机构提出复核裁定。案件当事人对价格认证中心出具的涉\n案财物价格鉴证结论持有异议的，可向行政、司法机关提出复核裁定\n要求，由行政、司法机关根据具体情况决定是否提出补充鉴证、重新\n鉴证或者复核裁定。","exp":""},{"id":408,"q":"5）请简述价格鉴证文书的归档范围。","ans":"价格鉴证文书的归档范围包括：\n（ 1 ）价格鉴证委托书\n（ 2 ）价格鉴证调查材料\n①价格鉴证的法律依据（国家有关法规的相关条款）；\n②委托事项当事人所从事的主要经济活动或者委托事项的背景材\n料；\n③委托标的物的证明材料，照片、图像资料，必要的技术鉴证材\n料。\n（ 3 ）价格鉴证结论书\n（ 4 ）价格鉴证复核裁定结论书\n①涉案财物价格鉴证复核裁定委托书；\n②涉案财物价格鉴证复核裁定结论书；\n③涉案财物价格鉴证最终复核裁定结论书；\n④与复核裁定相关的资料。","exp":""}]},{"id":409,"part":"历年真题","src":"2006年","year":"2006","chap":"","qtype":"short","stem":"2 ．二、下面给出的案例提示和价格鉴证结论书中有 10 处以上错误，请找出 10 处（前 10 处有效）并简要说明正确做法，因前面的错误导致的错误只算一个错误。（ 25 分）案例提示：\n×× 市公安局于 2005 年 9 月 15 日委托 ×× 市价格认证中心对 2005 年 8 月\n15 日被盗的一辆普通桑塔纳轿车进行价格鉴证。该价格认证中心按规定进行了价格鉴证并出具了结论书。关于 ×× 普通桑塔纳轿车的价格鉴证结论书\n×× 市公安局：根据你局 ×× 号价格鉴证委托书的委托，我单位遵循独立、客观、公正的原则，按照规定的标准、程序和方法，依法对普通型桑塔纳轿车进行了价格鉴证。现将价格鉴证情况综述如下：一、价格鉴证标的价格鉴证标的为上海大众公司生产的普通型桑塔纳轿车，车牌号： ××× ，发动机号码： ××× ，车架号： ××× ，排量为 1.6L ，手动挡。二、价格鉴证目的为法院办案提供价格鉴证标的价格依据。三、价格鉴证基准日\n2005 年 9 月 15 日。四、价格定义价格鉴证结论所指价格是：鉴证标的在鉴证委托日，采用公开市场价值标准确定的市场价格。五、价格鉴证依据（一）法律法规依据\n1 ．《中华人民共和国价格法》；\n2 ．国家计委、最高人民法院、最高人民检察院、公安部《扣押、追缴、没收物品估价管理办法》；\n3 ．国家经贸委等六部委《关于发布〈汽车报废标准〉的通知》；\n4 ．《关于进口车辆计征车辆购置附加费的有关问题的通知》；\n5 ．《 ×× 省扣押、追缴、没收等涉案物品估价管理办法》。\n（二）委托方提供的有关资料\n1 ． ×× 公安局 ×× 号价格鉴证委托书；\n2 ． ×× 公安局交警支队车辆管理所提供的该车辆档案资料。\n（三）鉴证方收集的有关资料（略）六、鉴证方法成本法。七、价格鉴证过程我中心接受委托后即组成鉴证小组，指派两名技术人员进行现场勘验，其中一名价格鉴证人员进行市场调查。价格鉴证标的出厂日期为 2002 年 7 月 1 日，上海大众公司生产；里程表显示里程数为 40000 公里；行驶证记载的领证登记日期为 2002 年 9 月，于 2005 年 8 月 15 日被盗，后追回。现场勘验车况如下：\n1 ．发动机、变速箱状况良好。\n2 ．车身车架良好，曾因发生轻微交通事故，左前车门有修复喷漆的痕迹，修复效果不理想。\n3 ．空调正常，音响系统由车主进行改进，原有收放机已于 2004 年\n4 月更换为日本索尼牌车载单碟 CD 播放机，该机运行正常。\n4 ．路试检测正常。市场调查情况如下：普通桑塔纳轿车在市场上交易频繁，行驶年限在 2 ～ 3 年，行驶里程在 50000 公里以内且未发生过重大交通事故的普通型桑塔纳 1.6L 手动挡轿车市场成交价格为 65000 元。本次鉴证以旧机动车交易市场该类车型成交价格为基础，并考虑影响车辆价格因素确定该车价格。影响该车车辆价格因素：由于该车曾发生过轻微交通事故，造成左前车门损伤，虽经修复喷漆，但修复效果不理想，需重新打磨喷漆，费用 400 元；该车音响系统经车主改装，由一般收放机改为日产索尼 CD 播放机，该型 CD 机现在市场全新价格为 1200 元，按其改装日期，综合评定 CD 机成新率为 90% ，价值为 1080 元。鉴证价格＝ 65000 ＋ 400 － 1080 ＝ 64320 （元）八、价格鉴证结论价格鉴证标的的价格为人民币 64320 元。九、价格鉴证限定条件\n1 ．委托方提供资料客观真实；\n2 ．委托标的在本市所在地公开市场进行交易。十、声明\n1 ．价格鉴证结论受结论书中已说明的限定条件限制。\n2 ．委托方提供资料的真实性由委托方负责。\n3 ．价格鉴证结论仅对本次委托有效，不做他用。未经我中心同意，不得向委托方和有关当事人之外的任何单位和个人提供，结论书的全部或部分内容，不得发表于任何公开媒体上。\n4 ．鉴证机构和鉴证人员与价格鉴证标的没有利害关系，也与有关当事人没有利害关系。\n5 ．如对结论书有异议，可于结论书送达之日起十五日内向原鉴证机构提出重新鉴证、补充鉴证或委托省级以上（含省级）政府价格主管部门设立的价格鉴证机构复核裁定。十一、价格鉴证作业日期\n2005 年 10 月 15 日至 2005 年 10 月 17 日。十二、价格鉴证机构机构名称： ×××××××\n机构资质证书证号： ×××××××\n法定代表人签字：（略）十三、价格鉴证人员姓名执业资格名称签字\n××××××××××××× （略）\n××××××××××××× （略）\n×× 市价格认证中心（公章）二〇〇五年十月十七日","opts":[],"ans":"1．价格鉴证基准日有误，应以被盗日为价格鉴证基准日，即\n2005 年 8 月 15 日。\n2 ．鉴证目的错误，应为公安机关提供依据。\n3 ．价格定义内容中，所指价格应该是采用公开市场价值标准确定\n的客观合理的价格，而不是采用公开市场价值标准确定的市场价格。\n4 ．价格鉴证依据中，《关于进口车辆计征车辆购置附加费的有关\n问题的通知》与本案没有关系，因为标的为国产 "part":"历年真题","src":"2005年","year":"2005","chap":"","qtype":"short","stem":"1 ．一、根据给出的价格鉴证资料，简要回答下面的问题。（ 15 分）\nA 市交警大队在处理交通事故中，委托 A 市价格认证中心对事故中损坏车辆的损失价格进行鉴证。 A 市价格认证中心派出鉴证小组会同车辆检测专家进行了现场勘察，详细记录了受损部件和受损程度。随后，鉴证小组到一家汽车配件公司调查了损坏部件的价格。在撰写价格鉴证结论书时，鉴证人员根据计算公式：鉴证价格＝ ∑ （配件价格＋\n配件管理费＋工时费用）－残值，对损失价格进行鉴证，形成正式的价格鉴证结论书，直接交给当事人。当事人对此价格鉴证结论书有异议，要求 A 市价格认证中心重新鉴证， A 市价格认证中心答复当事人，如对此价格鉴证结论书有异议，应按规定程序办理。请根据上述资料回答以下问题：","opts":[],"ans":"价格鉴证人员的市场调查应该广泛，调查 3 家以上的公司，验证价格的\n真实性和可信程度，分析交易条件和背景，影响价格的各种因素，一\n般应选取市场上的平均价格。","exp":"","stale":false,"items":[{"id":413,"q":"1）价格鉴证人员应如何进行市场调查并求取汽车配件的市场价格？","ans":"价格鉴证人员的市场调查应该广泛，调查 3 家以上的公司，验证价格的\n真实性和可信程度，分析交易条件和背景，影响价格的各种因素，一\n般应选取市场上的平均价格。","exp":""},{"id":414,"q":"2）鉴证价格公式是否正确？如不正确，应如何改正？","ans":"鉴证价格公式不完整，应为：\n鉴证价格＝ ∑ （配件价格＋配件管理费＋工时费用＋其他费用）－\n残值。","exp":""},{"id":415,"q":"3）A 市价格认证中心进行本项目价格鉴证的送达程序有无错误？应该怎么办？","ans":"A 市价格认证中心进行本项目价格鉴证的送达程序有误。\n为了使价格鉴证结论书发挥应有的作用，保护当事人的合法权\n益，维护价格鉴证结论书的严肃性，价格鉴证机构必须按照规定的程\n序将价格鉴证结论书送达委托人。\n价格鉴证结论书制作完成以后，价格鉴证机构应当及时通知委托\n人领取；委托人领取有困难的，也可以由价格鉴证机构发送。在特殊\n情况急需使用时，也可以使用传真机将价格鉴证结论书正本传送给委\n托人，作为副本使用，然后立即将价格鉴证结论书送达委托人或其代\n理人。送达价格鉴证结论书要使用送达回执单，当事人或其代理人应\n在送达回执上签名或者盖章，并注明收到的日期、份数和价格鉴证结\n论书的编号。代理人代领时，送达人应该核对代理人的身份和委托\n书。\n所以鉴证结论书应该由鉴证人签字、法人代表签发并加盖单位公\n章，送达委托人，而不是当事人。","exp":""},{"id":416,"q":"4）当事人如对此价格鉴证结论书有异议应如何申请重新鉴证？","ans":"案件当事人对价格认证中心出具的涉案财物价格鉴证结论持有异议\n的，可向行政、司法机关提出复核裁定要求，由行政、司法机关根据\n具体情况决定是否提出补充鉴证、重新鉴证或者复核裁定。","exp":""},{"id":417,"q":"5）省级复核裁定机构的权限有哪些？","ans":"省级复核裁定机构的权限有：\n（ 1 ）受理本行政区域内的刑事案件、纪检监察案件中涉案物品价\n格鉴证的复核裁定；\n（ 2 ）受理双方当事人都同属本行政管辖的经济、行政、民事案件\n中涉案物品价格鉴证的复核裁定。","exp":""}]},{"id":418,"part":"历年真题","src":"2005年","year":"2005","chap":"","qtype":"short","stem":"2 ．二、下面给出的案例提示和价格鉴证结论书中有 10 处以上错误，请找出 10 处错误并简要说明正确做法，因前面的错误导致的错误只算一处。（ 20 分）\n×× 工商行政管理局在办理一起商业欺诈案过程中，依法扣押了 ××\n公司的 150 台假冒松下 2188 彩电，需将这批彩电进行整体处置，请 ×× 省技术监督局对该批彩电进行了质量鉴证，并将这批彩电委托给 ×× 价格认证中心进行了价格鉴证。 ×× 价格认证中心受理后出具了如下的价格鉴证结论书。关于对假冒松下 2188 彩电的价格鉴证结论书\n×× 工商行政管理局：根据你局的委托，遵循独立、客观、公正的原则，按照规定的标准、程序和方法，我中心依法对你局扣押的 150 台假冒松下 2188 彩电进行了价格鉴证。现将价格鉴证情况综述如下：一、价格鉴证标的价格 计算设备加权投资年限：\n（ 202.81×7 ＋ 8.05×4 ） /210.86 ＝ 6.89 （年）。\n3 ．计算设备实际利用率：\n45000/56000×100% ＝ 80.36% 。\n4 ．计算设备有形损耗率：\n（加权投资年限 × 实际利用率） ÷ （加权投资年限 × 实际利用率＋剩\n余年限） ×100% ＝（ 6.89×80.36% ） ÷ （ 6.89×80.36% ＋ 5 ） ×100% ＝\n53% 。\n5 ．计算折现率（投资报酬率）：\n1.98% ＋ 6.5% ＝ 8.48% 。\n6 ．计算设备功能性贬值：\n2× （ 1 － 33% ） /8.48%×[1 － 1/ （ 1 ＋ 8.48% ）5]＝ 5.28 （万元）。\n7 ．计算经济性贬值率：\n（ 1 － 0.90.6） ×100% ＝ 6.13% 。\n8 ．计算设备鉴证价值：\n[210.86× （ 1 － 53% ）－ 5.28]× （ 1 － 6.13% ）＝ 93.82×93.87% ＝\n88.07 （万元）。\n八、价格鉴证结论\n根据价格鉴证依据和价格鉴证方法，考虑到价格鉴证标的现实情\n况和市场行情，确定涉案生产设备于鉴证基准日的价值为￥ 88.07 万元\n（人民币捌拾捌万零柒佰元整）。\n九、价格鉴证限定条件\n1 ．委托方提供资料客观真实；\n2 ．价格鉴证标的能够持续生产。\n十、声明\n1 ．价格鉴证结论受结论书中已说明的限定条件限制。\n2 ．委托方提供资料的真实性由委托方负责。\n3 ．价格鉴证结论仅本次委托有效，不做他用。未经我中心同意，\n不得向委托方和有关当事人之外的任何单位和个人提供。结论书的全\n部内容，不得发表于任何公开媒体上。\n4 ．鉴证机构和鉴证人员与价格鉴证标的没有利害关系，也与有关\n当事人没有利害关系。\n5 ．如对结论有异议，可于结论书送达之日起 15 日内向鉴证机构提\n出重新鉴证、补充鉴证或委托省级以上政府价格主管部门设立的价格\n鉴证机构复核裁定。\n十一、价格鉴证作业日期\n2002 年 9 月 1 日至 2002 年 9 月 20 日。\n十二、价格鉴证机构\n机构名称： ×× 市价格认证中心\n机构资质证书证号： ××××××××××\n法人代表签字：（略）\n十三、价格鉴证人员\n十四、附件\n（一） ×× 市中级人民法院价格鉴证委托书复印件（略）；\n（二）价格鉴证机构资质证书复印件（略）；\n（三）价格鉴证人员资格证书复印件（略）。\n×× 市价格认证中心（公章）\n2002 年 9 月 20 日","exp":"","stale":false},{"id":430,"part":"历年真题","src":"2003年","year":"2003","chap":"","qtype":"short","stem":"1 ．一、根据所给资料简要回答问题。（每小题 2 分，共 10 分）某市公安局刑警大队于 2003 年 2 月 5 日破获一起盗窃案，追缴物品中有一辆进口尼桑轿车，因价格不明委托当地价格认证中心进行价格鉴证。委托书中对涉案汽车的型号、车牌号、发动机号、车架号及鉴证基准日等进行了描述并附有车辆行驶证复印件。根据刑警大队提供的有关资料，涉案汽车购于 2001 年 5 月 20 日，当时正值汽车销售公司搞优惠促销，共优惠了 2000 元，该车出厂日期为 2001 年 3 月 10 日，初次登记日期为 2001 年 6 月 2 日， 2002 年 2 月 3 日晚被盗。该车在案件破获后，即被公安机关追回，但由于车辆被盗后曾发生交通事故进行过修理，车辆状况已发生较大变化。请问：","opts":[],"ans":"鉴证基准日应为汽车被盗日 2002 年 2 月 3 日。","exp":"","stale":false,"items":[{"id":430,"q":"1）作为委托机关经办人，委托书中的鉴证基准日应如何确定？","ans":"鉴证基准日应为汽车被盗日 2002 年 2 月 3 日。","exp":""},{"id":431,"q":"2）公安机关提供的上述资料是否能够满足价格鉴证需要？如果资料不足，还需要补充哪些资料？","ans":"提供的资料不足。鉴于涉案汽车被盗时的状况与追回后的车况发生较\n大变化，应补充提供失主和证人的陈述、证言以及犯罪嫌疑人的供述\n等与案发时车辆状况有关的资料。","exp":""},{"id":432,"q":"3）确定被盗汽车重置价格，失主购车时的优惠价款应如何处理？","ans":"不应考虑优惠价款。因为被盗汽车的重置价格与案发时市场上同型号\n汽车的销售价格有关，与购车时的优惠政策无关。","exp":""},{"id":433,"q":"4）汽车使用年限应从何时开始计算？","ans":"汽车使用年限应从汽车初次登记日期 2001 年 6 月 2 日算起。","exp":""},{"id":434,"q":"5）如果被盗汽车为免交进口关税的外商投资企业自用车辆，则确定该车重置价格时，免交的有关税费应如何处理？","ans":"确定汽车重置价格时，应加上免交的关税，具体数额按鉴定基准日时\n的国家税费政策计算。","exp":""}]},{"id":435,"part":"历年真题","src":"2003年","year":"2003","chap":"","qtype":"short","stem":"2 ．二、下面给出的价格鉴证技术报告片段中有 7 个以上的技术性错误，请找出其中的 7 个技术性错误并说明理由。找出错误超出 7 个的，前 7 个有效。因前面的错误导致的错误只算是一个错误。（ 20 分）\n（一）鉴证目的、范围\n×× 有限公司（以下简称“×× 公司” ）系某股份有限公司的全资子公司，因经济纠纷，法院决定将 ×× 公司整体抵债，并委托某价格认证中心对其整体价值进行鉴证，价格鉴证范围为 ×× 公司的全部资产及相关负债的整体资产价值。价格鉴证基准日为 2001 年 6 月 30 日。\n×× 公司营业执照中规定的经营范围为：化肥，石油化工产品，机电、机械设备及备品、配件，建筑材料，房地产开发，技术工程咨询服务，进出口贸易。 ×× 公司执行一般纳税企业所得税政策。\n（二）背景分析经价格鉴证人员对企业历史数据的分析， ×× 公司自 2000 年度开始步入稳定的生产状态，截至价格鉴证基准日 2001 年 6 月 30 日， ×× 公司主要产品已相对成熟，生产能力充分实现，公司发展已走入正轨，通过对 ×× 公司的宏观环境、市场与经营优势及风险的分析， ×× 公司自 1996\n年投产以来，发展一直呈良好的态势。\n（三）价值鉴证方法鉴于 ×× 公司具有较强的持续经营能力，同时可以取得相对稳定的收入并获取一定的利润，因此应用收益法鉴证 ×× 公司整体资产价值。企业整体收益现值计算公式为：式中：\nP——企业整体资产价值\nA——企业年净收益\nr——折现率\nn——收益年限（四）价格鉴证过程\n1 ．收益法中采用的假设一般假设：假设 ×× 公司 2001 年 6 月 30 日以后仍持续经营；假设 ×× 公司的经营者是负责的，且公司管理层有能力担当其职务；除非另有说明，假设 ×× 公司完全遵守所有有关的法律和法规；假设 ×× 公司提供的历年财务资料所采取的会计政策和编写此份报告时所采用的会计政策在重要方面基本一致。特殊假设：假设 ×× 公司的经营环境、行业性质、经营风险等方面保持稳定、正常地发展。\n2 ．收益法主要因素的确定在收益法下，将 ×× 公司的预期收益按照折现率折现为价格鉴证基准日的净现值。为此，需要确定以下三个主要因素：（ 1 ）收益期（即预计净收益得以维持的期间）；（ 2 ）每年净收益；（ 3 ）合理的折现率。\n（ 1 ）收益期。由于没有发现 ×× 公司在可预见的未来终止经营的任何理由，在 ×× 公司整体资产的价格鉴证中应按无限年期进行测算。\n（ 2 ）每年净收益。鉴于 ×× 公司 1999 年以前处于试生产阶段， 2000\n年进入稳定期的情况，基于谨慎原则决定以 ×× 公司 2000 年的收入、利润为基础对 ×× 公司未来收益进行预测，包括分别预测企业的各项收入与各项费用。 2001—2005 年各年收益预测见下表， 2006 年以后各年收益稳定不变。净利润＝主营业务收入－主营业务成本－营业费用－主营业务税金及附加－财务费用－所得税（按所得利润总额的 27% 计算）\n（ 3 ）合理的折现率根据同行业上市公司 2000 年年报资料，经分析得到同行业 2000 年平均净资产收益率为 9% 。考虑到 ×× 公司的发展过程中可能要面临着许多风险，如市场不很稳定、市场竞争较为激烈等，综合考虑 ×× 公司的行业风险、经营风险以及财务风险，并综合 ×× 公司自身的资产规模、原材料采购模式、生产经营情况等其他个体风险因素，确定行业风险报酬率 3% ，企业财务风险报酬率 0.5% ，企业经营风险报酬率 1.5% ，则：折现率＝平均净资产收益率＋行业风险报酬率＋企业风险报酬率\n＝ 9% ＋ 3% ＋ 0.5% ＋ 1.5% ＝ 14%\n3 ．收益折现值的计算过程基于折现的目的，假定每年的净收益均产生在当年年底。未来收益按照不同的时间段分为以下三个阶段：\n（ 1 ） 2001 年 7 ～ 12 月的净利润；\n（ 2 ） 2002 年至 2005 年各年的净利润；\n（ 3 ） 2006 年及以后各年的净利润。计算 chap":"","qtype":"short","stem":"xx 公司出租汽车营运证使用权的价格鉴定技术报告\n1.价格鉴定标的概述因经济纠纷，xx 出租汽车公司将其所有的 66 个出租车营运证的使用权用于抵债。其营运证使用权情况如下：营运证取得日期数量（个）有效使用年限\n1997.04.30 33 10 年\n1998.01.31 20 10 年\n1999.07.31 13 10 年\n2.营运证使用权价格测算过程（价格鉴定基准日为 2005 年 1 月 31\n日）\n（1）营运证使用权客观预期收益的计算价格鉴定人员经过调查，测算出该市出租车营运公司的营运证平均每月每证收入 3300 元。根据《xx 市出租汽车公司现状与营运收入、成本、利润调查情况》分析，各项费用占总收入的比例如下：项目人员工资保险费税金其他费用经营利润比例%\n16.5 3.4 5.8 9.5 17.8 35.2\n因此营运证使用权客观预期收益每证每月为 3300×（1-35.2%）\n=2138.40 元，每年为 2138.40×12=25660.80 元。\n（2）资本化率的确定公式：资本化率=无风险报酬率+风险报酬率其中：假设银行贴现率为 2%；银行一年期定期存款利率为 2.25%；风险报酬率经调查测算确定为 4%。问题：请找出上述价格鉴定技术报告中存在的六处错误，并加以改正。","opts":[],"ans":"1.错误一：在概述部分，未明确说明营运证使用权的抵债具体金额或\n价值。\n改正：应在概述部分补充说明营运证使用权的总价值或每证的评估价\n值，以及用于抵债的具体金额。\n2.错误二：有效使用年限的表述可能产生歧义。\n改正：应明确说明有效使用年限是指从取得日期起至某一具体日期的\n年限，或说明该年限是如何计算的。\n3.错误三：在计算预期收益时，未考虑营运证使用权的递减或增值情\n况。\n改正：应考虑营运证使用权随时间推移可能产生的价值变化，如市场\n需求、政策变化等因素对营运证价值的影响。但在此案例中，由于未\n提供足够信息，可假设价值稳定，但应在报告中说明这一点。\n4.错误四：在计算预期收益时，未明确说明各项费用的具体计算方法\n和数据来源。\n改正：应详细列出各项费用的计算方法和数据来源，以确保预期收益\n的准确性和可信度。\n5.错误五：资本化率的确定中，未明确说明无风险报酬率和风险报酬\n率的具体含义和计算方法。\n改正：应详细解释无风险报酬率（如银行定期存款利率）和风险报酬\n率（如根据市场风险、行业风险等因素确定的额外报酬率）的具体含\n义和计算方法。\n6.错误六：整个报告未包含对鉴定结果的验证和复核过程。\n改正：应增加对鉴定结果的验证和复核过程，以确保鉴定结果的准确\n性和可靠性。这可以包括使用不同的方法或数据来验证鉴定结果，以\n及由其他专业人员进行复核等。","exp":"","stale":false},{"id":469,"part":"押题卷","src":"押题A卷","year":"2024","chap":"","qtype":"short","stem":"案例背景：某房地产开发商拟将其开发的一处商业楼盘进行出售，现委托某评估机构对该楼盘的市场价值进行评估。评估基准日为 2024 年 10 月 1 日。评估人员经过现场勘查和市场调查，决定采用市场比较法对该楼盘进行评估。\n1.请简述不动产价格鉴证评估的主要目的。","opts":[],"ans":"不动产价格鉴证评估的主要目的包括为不动产交易、抵押、\n租赁、税收、征收、拆迁补偿等提供价格参考依据。","exp":"不动产价格鉴证评估是房地产市场中的重要环节，其评估结果能够为各类不动产交易和相关经济活动提供客观、公正的价格参考，有助于维护市场秩序和各方利益。","stale":false},{"id":470,"part":"押题卷","src":"押题A卷","year":"2024","chap":"","qtype":"short","stem":"案例背景：某房地产开发商拟将其开发的一处商业楼盘进行出售，现委托某评估机构对该楼盘的市场价值进行评估。评估基准日为 2024 年 10 月 1 日。评估人员经过现场勘查和市场调查，决定采用市场比较法对该楼盘进行评估。\n2.在采用市场比较法进行不动产价格鉴证评估时，应如何选择比较案例？","opts":[],"ans":"在采用市场比较法进行不动产价格鉴证评估时，应选择与被\n评估不动产在地理位置、用途、规模、档次、建筑结构、装修标准等\n方面相似，且交易时间相近的已成交案例作为比较案例。","exp":"市场比较法的核心在于通过比较相似不动产的交易价格来推算被评估不动产的市场价值。因 ,"src":"押题B卷","year":"2024","chap":"","qtype":"single","stem":"某企业拥有一项专利技术，该技术投入使用后，每年为企业带来稳定的收益。已知该专利技术的研发成本为 50 万元，目前市场上类似技术的交易案例较多，且该企业所在行业的平均收益率为 1 5%。经专业评估机构评估，该专利技术的剩余经济寿命为 5 年，预测未来每年的收益分别为 20 万元、22 万元、24 万元、26 万元、28 万元。若采用收益法对该专利技术进行价格鉴证，折现率应确定为（ ）。","opts":[{"k":"A","v":"10% B . 12% C . 15% D . 20%"}],"ans":"C","exp":"行业平均收益率可作为确定折现率的参考，该企业所在行业平均收益率为 15%，所以折现率应确定为 15%。解析：在收益法中，折现率的确定通常参考行业平均收益率、风险报酬率等因素。本题中明确提到企业所在行业的平均收益率为 15%，所以应以此为基础确定折现率。","stale":false},{"id":476,"part":"押题卷","src":"押题B卷","year":"2024","chap":"","qtype":"single","stem":"某企业拥有一项专利技术，该技术投入使用后，每年为企业带来稳定的收益。已知该专利技术的研发成本为 50 万元，目前市场上类似技术的交易案例较多，且该企业所在行业的平均收益率为 1 5%。经专业评估机构评估，该专利技术的剩余经济寿命为 5 年，预测未来每年的收益分别为 20 万元、22 万元、24 万元、26 万元、28 万元。该专利技术的价格鉴证值为（ ）万元。","opts":[{"k":"A","v":"70.56 B . 75.89 C . 82.34 D . 88.77"}],"ans":"C","exp":"首先计算每年收益的现值，第一年收益现值 = 20 / (1 + 15%)^1 ≈\n17.39 万元；第二年收益现值 = 22 / (1 + 15%)^2 ≈ 17.02 万元；第三年收益现值 = 2 4 / (1 + 15%)^3 ≈ 1 6.45 万元；第四年收益现值 = 26 / (1 + 15%)^4 ≈ 15.72 万元；第五年收益现值 = 28 /\n(1 + 15%)^5 ≈ 15.76 万元。然后将各年收益现值相加，即 17.39 +\n17.02 + 16.45 + 15.72 + 15.76 = 82.34 万元。解析：根据收益法的计算公式，将未来各年的收益按照折现率折现到当前时点，再将各年的现值相加，即可得到该专利技术的价格鉴证值。","stale":false},{"id":477,"part":"押题卷","src":"押题B卷","year":"2024","chap":"","qtype":"judge","stem":"某企业拥有一项专利技术，该技术投入使用后，每年为企业带来稳定的收益。已知该专利技术的研发成本为 50 万元，目前市场上类似技术的交易案例较多，且该企业所在行业的平均收益率为 1 5%。经专业评估机构评估，该专利技术的剩余经济寿命为 5 年，预测未来每年的收益分别为 20 万元、22 万元、24 万元、26 万元、28 万元。该专利技术的研发成本对其价格鉴证值没有影响。（ ）","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B","exp":"解析：研发成本是确定专利技术价值的重要因素之一，虽然收益法主要考虑未来的收益，但研发成本也是前期的投入，会对价格鉴证值产生一定的影响。","stale":false},{"id":478,"part":"押题卷","src":"押题B卷","year":"2024","chap":"","qtype":"judge","stem":"某企业拥有一项专利技术，该技术投入使用后，每年为企业带来稳定的收益。已知该专利技术的研发成本为 50 万元，目前市场上类似技术的交易案例较多，且该企业所在行业的平均收益率为 1 5%。经专业评估机构评估，该专利技术的剩余经济寿命为 5 年，预测未来每年的收益分别为 20 万元、22 万元、24 万元、26 万元、28 万元。如果该企业所在行业的平均收益率上升，那么该专利技术的价格鉴证值会下降。（ ）","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B","exp":"解析：行业平均收益率上升，意味着折现率可能会上升，在未来收益不变的情况下，折现率上升会导致各年收益的现值下降，从而使专利技术 ，质地细腻，透明度较高，雕刻工艺精湛，呈现的是一个栩栩如生的观音形象。委托方提供了购买凭证，显示购买时间为 3 年前，购买价格为 5 万元。经鉴定机构专业鉴定，该翡翠的种水为冰种，在当前市场上冰种翡翠挂件较为受欢迎。该翡翠挂件在进行价格鉴证时，最适合采用的方法是（ ）","opts":[{"k":"A","v":"成本法"},{"k":"B","v":"市场法"},{"k":"C","v":"收益法"},{"k":"D","v":"专家咨询法"}],"ans":"B","exp":"解析：市场法是通过比较类似物品在市场上的交易价格来确定被评估物品的价值，对于翡翠挂件这种在市场上有较多类似交易案例且市场较为活跃的物品，市场法是最适合的方法。成本法适用于计算物品的重置成本，但对于翡翠这种天然形成且价值受市场因素影响较大的物品不太适用；收益法通常适用于能产生持续收益的资产，翡翠挂件一般不适用；专家咨询法的主观性较强，不如市场法客观准确。","stale":false},{"id":501,"part":"押题卷","src":"押题B卷","year":"2024","chap":"","qtype":"single","stem":"有一件翡翠挂件，委托方要求对其进行价格鉴证。该翡翠挂件颜色鲜艳，质地细腻，透明度较高，雕刻工艺精湛，呈现的是一个栩栩如生的观音形象。委托方提供了购买凭证，显示购买时间为 3 年前，购买价格为 5 万元。经鉴定机构专业鉴定，该翡翠的种水为冰种，在当前市场上冰种翡翠挂件较为受欢迎。如果该翡翠挂件在当前市场上类似品质和工艺的挂件交易价格在 8 万 - 10 万元之间，那么该翡翠挂件的价格鉴证值最可能是（ ）","opts":[{"k":"A","v":"7 万元"},{"k":"B","v":"9 万元"},{"k":"C","v":"11 万元"},{"k":"D","v":"13 万元"}],"ans":"B","exp":"在市场法下，价格鉴证值会参考类似物品的市场交易价格，该挂件类似品质和工艺的交易价格在 8 万 - 10 万元之间，\n9 万元处于这个区间的中间位置，是最有可能的价格鉴证值。7 万元低于常见交易价格范围，11 万元和 13 万元超出了给定的交易价格范围。","stale":false},{"id":502,"part":"押题卷","src":"押题B卷","year":"2024","chap":"","qtype":"judge","stem":"有一件翡翠挂件，委托方要求对其进行价格鉴证。该翡翠挂件颜色鲜艳，质地细腻，透明度较高，雕刻工艺精湛，呈现的是一个栩栩如生的观音形象。委托方提供了购买凭证，显示购买时间为 3 年前，购买价格为 5 万元。经鉴定机构专业鉴定，该翡翠的种水为冰种，在当前市场上冰种翡翠挂件较为受欢迎。该翡翠挂件的购买价格对其当前的价格鉴证值没有任何参考价值。 （ ）","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B","exp":"解析：购买价格可以作为一个参考因素，虽然市场情况会发生变化，但购买价格在一定程度上能反映出当时的市场行情以及这件翡翠挂件的初始价值，对当前的价格鉴证值有一定的参考意义，所以该说法是错误的。","stale":false},{"id":503,"part":"押题卷","src":"押题B卷","year":"2024","chap":"","qtype":"judge","stem":"有一件翡翠挂件，委托方要求对其进行价格鉴证。该翡翠挂件颜色鲜艳，质地细腻，透明度较高，雕刻工艺精湛，呈现的是一个栩栩如生的观音形象。委托方提供了购买凭证，显示购买时间为 3 年前，购买价格为 5 万元。经鉴定机构专业鉴定，该翡翠的种水为冰种，在当前市场上冰种翡翠挂件较为受欢迎。翡翠的种水是影响其价格的唯一因素。（ ）","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B","exp":"解析：翡翠的价格受到多种因素的影响，种水只是其中一个重要因素，还包括颜色、透明度、雕刻工艺、大小、瑕疵等因素，所以翡翠的种水不是影响其价格的唯一因素。","stale":false},{"id":504,"part":"押题卷","src":"押题B卷","year":"2024","chap":"","qtype":"multi","stem":"有一件翡翠挂件，委托方要求对其进行价格鉴证。该翡翠挂件颜色鲜艳，质地细腻，透明度较高，雕刻工艺精湛，呈现的是一个栩栩如生的观音形象。委托方提供了购买凭证，显示购买时间为 3 年前，购买价格为 5 万元。经鉴定机构专业鉴定，该翡翠的种水为冰种，在当前市场上冰种翡翠挂件较为受欢迎。以下哪些因素会影响该翡翠挂件的价格鉴证（ ）","opts":[{"k":"A","v":"翡翠的颜色"},{"k":"B","v":"翡翠的产地"},{"k":"C","v":"雕刻工艺的精细程度"},{"k":"D","v":"市场的供求关系"}],"ans":"A|C|D","exp":"解析：翡翠的颜色是影响其价值的重要因素，颜色鲜艳的翡翠通常价值更高；雕刻工艺的精细程度也会对翡翠的价值产生较大影响，工艺精湛的翡翠挂件更具观赏性和艺术价值，价格也会更高；市场的供求关系对翡翠的价格有直接影响，当市场上对冰种翡翠挂件的需求较大而供应较少时，价格会上涨。而翡翠的产地对其价值的影响相对较小，一般来说，缅甸是翡翠的主要产地，但不能单纯以产地来判断翡翠的价值。","stale":false},{"id":505,"part":"押题卷","src":"押题B卷","year":"2024","chap":"","qtype":"short","stem":"案例关于被盗笔记本电脑的价格鉴证案例分析一、背景\n2006 年 3 月，某市公安局破获一起盗窃案，追回一台被盗的笔记本电脑。该电脑系 2005 年 1 月购买，品牌型号为联想 ThinkPad T43，购买时价格为 8000 元。市公安局委托市价格认证中心对该电脑进行价格鉴证，以作为办案依据。二、价格鉴证报告\n1.鉴证标的：被盗联想 ThinkPad T43 笔记本电脑一台。\n2.鉴证目的：为市公安局办理盗窃案提供价格依据。\n3.鉴证基准日：2006 年 3 月 10 日。\n4.鉴证方法：成本法与市场法结合。\n5.鉴证过程：调查了解该型号电脑的市场销售价格及折旧情况。根据电脑购买价格及使用时间计算折旧额。结合市场销售价格及折旧额确定鉴证价格。\n6.鉴证结果：该电脑鉴证价格为 5000 元。请找出上述价格鉴证报告中存在的六处错误，并给出正确答案及解析。","opts":[],"ans":"1.错误一：鉴证基准日选择不当。\n正确答案：鉴证基准日应为被盗日或接近被盗日的日期，以反映被盗\n时的市场价格。本例中，鉴证基准日选择为 2006 年 3 月 10 日，即破\n案追回电脑后的日期，不能准确反映被盗时的市场价格。\n解析：价格鉴证应遵循时点原则，即鉴证结果应是在某一特定时点的\n价格。被盗物品的价格鉴证应以被盗日或接近被盗日的日期为基准日。\n2.错误二：未考虑电脑的品牌、型号及配置对价格的影响。\n正确答案：在鉴证过程中，应详细描述电脑的品牌、型号及配置，并\n考虑这些因素对价格的影响。\n解析：不同品牌、型号及配置的电脑价格差异较大。在鉴证过程中，\n应详细描述电脑的具体信息，并据此确定其市场价格。\n3.错误三：折旧计算方法不准确。\n正确答案：折旧额应根据电脑的使用寿命、已使用时间及残值等因素\n综合计算。本例中，仅根据购买价格和使用时间计算折旧额，未考虑\n其他因素。\n解析：折旧是价格鉴证中的一个重要环节。折旧额的计算应综合考虑\n多种因素，以确保鉴证结果的准确性。\n4.错误四：未考虑电脑的市场供需情况对价格的影响。\n正确答案：在鉴证过程中，应了解电脑的市场供需情况，并考虑其对\n价格的影响。\n解析：市场价格受供需关系的影响。在鉴证过程中，应了解电脑的市\n场供需情况，以判断其价格走势。\n5.错误五：鉴证结果未考虑税费及附加费用。\n正确答案：在鉴证过程中，应考虑税费及附加费用对价格的影响，并\n在鉴证结果中予以体现。\n解析：税费及附加费用是构成商品价格的重要部分。在鉴证过程中，\n应了解相关税费及附加费用政策，并据此调整鉴证结果。\n6.错误六：鉴证报告未包含必要的附件和说明。\n正确答案：鉴证报告应包含必要的附件和说明，如电脑购买发票、市\n场调查资料、折旧计算表等。\n解析：鉴证报告是价格鉴证工作的成果体现。一份完整的鉴证报告应\n包含必要的附件和说明，以证明鉴证过程的合法性和鉴证结果的准确\n性。","exp":"","stale":false},{"id":506,"part":"押题卷","src":"押题B卷","year":"2024","chap":"","qtype":"short","stem":"案例背景：某工厂因资产重组，拟将一台数控机床转让，现委托某评估机构对该机床的价值进行评估。评估基准日为 2023 年 12 月 31 日。评估人员经过调查分析，决定采用成本法对该机床进行评估。\n1.请简述数控机床的主要用途及特点。","opts":[],"ans":"数控机床主要用于高精度、复杂形状零件的加工。其特点\n包括高精度、高效率、高柔性 <script>
(function(){

  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function dayKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  var TODAY = dayKey(new Date());
  function dayFrom(k){

  var store = load();

  function esc(s){ return String(s).replace(/[&<>"']/g, function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }
  function fmtAns(a){ return String(a).split("|").join(""); }
  function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }

  // ---- 存档：v1(只有 a/f) 自动升级成 v2(逐题档案 + 每日流水) -----------
  function blank(){ return {v:2, h:{}, f:{}, r:{}, log:{}}; }

      try { raw = localStorage.getItem(LS_OLD); } catch(e){ raw = null; }

    if (d.h) return {v:2, h:d.h, f:d.f || {}, r:d.r || {}, log:d.log || {}};

    s = blank();
    function bump(day, ok){
      var t = s.log[day] || (s.log[day] = {n:0, w:0, d:0});

    }
    Object.keys(d.a || {}).forEach(function(id){
      var k = d.a[id], q = byId[id], ok = !!(q && k === q.ans);
      s.h[id] = {n:1, w: ok ? 0 : 1, ok: ok ? 1 : 0, last:k,
                 d:TODAY, wd: ok ? "" : TODAY, s: ok ? 1 : 0};

  }

  var saveTimer = null;
  function save(){ if (saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 800); }

    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }

  }

  document.addEventListener("visibilitychange", function(){ if (document.hidden) saveNow(); });

  // ---- 每题状态 --------------------------------------------------------
  // h[id] = {n:作答次数, w:错误次数, ok:最后一次是否对, last:最后选的, d:最后作答日, wd:最后答错日, s:连续答对次数}
  function recOf(q){ return store.h[q.id]; }
  function isWrong(q){ var e = recOf(q); return !!e && e.w > 0 && (e.s || 0) < 2; }
  function isFixed(q){ var e = recOf(q); return !!e && e.w > 0 && (e.s || 0) >= 2; }
  function isFresh(q){ return !recOf(q) || !!store.r[q.id]; }

  function record(q, k){

    e.ok = ok ? 1 : 0; e.last = k; e.d = TODAY;
    var t = store.log[TODAY] || (store.log[TODAY] = {n:0, w:0, d:0});
    t.n++; if (ok) t.d++; else t.w++;
    delete store.r[q.id];
    save();
  }

  // ---- 筛选 ------------------------------------------------------------
  function applyFilter(keepId){
    var part = $("selPart").value, year = $("selYear").value, chap = $("selChap").value;
    var days = $("selTime").value;
    var w = $("cWrong").classList.contains("on"), f = $("cFav").classList.contains("on");
    var from = days ? dayFrom(+days) : "";

    view = RAW.filter(function(q){
      if (part !== "全部" && q.part !== part) return false;
      if (year && q.year !== year) return false;
      if (chap && q.chap !== chap) return false;
      if (w && !isWrong(q)) return false;
      if (f && !store.f[q.id]) return false;
      if (from) {
        var e = store.h[q.id];
        if (!e) return false;
        var key = (w && e.wd) ? e.wd : e.d;   // 看错题时按"最后答错日"，否则按"最后作答日"
        if (!key || key < from) return false;
      }
      return true;
    });

    if ($("cShuf").classList.contains("on")) {
      for (var i = view.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1)), t = view[i];
        view[i] = view[j]; view[j] = t;
      }
    }
    if (keepId) {
      var k = view.findIndex(function(q){ return q.id === keepId; });
      pos = k >= 0 ? k : 0;
    } else {
      var n = view.findIndex(isFresh);
      pos = n >= 0 ? n : 0;
    }
    revealedId = null;
    render();
  }

  // ---- 渲染 ------------------------------------------------------------
  function render(){
    cur = view[pos];
    if (!cur) {
      app.innerHTML = '<div class="card"><div class="empty">这个筛选下没有题。<br>把「只看错题 / 只看收藏 / 时间」放宽一点，或者换章节。</div></div>';
      $("hdStat").textContent = "0 题";
      $("fav").classList.remove("on");
      $("fav").textContent = "☆";
      return;
    }
    var id = cur.id;
    var e = store.h[id];
    var redone = !!store.r[id];
    var chosen = (!redone && e) ? e.last : null;
    var done = chosen != null;
    var isMulti = cur.qtype === "multi";
    var isShort = cur.qtype === "short";
    var revealed = (revealedId === id);
    var qt = cur.qtype === "judge" ? "判断" : (isShort ? "主观" : (isMulti ? "多选" : "单选"));

    pending = [];
    var tags = '<span class="tag">' + esc(cur.src) + '</span><span class="tag">' + qt + '</span>';
    if (cur.chap) tags += '<span class="tag">' + esc(cur.chap) + '</span>';
    if (cur.stale) tags += '<span class="tag warn">可能过时</span>';
    if (redone) tags += '<span class="tag redo">待重做</span>';

    var html = '<div class="card"><div class="meta">' + tags +
      '<span class="idx">' + (pos + 1) + " / " + view.length + '</span></div>' +
      '<div class="stem">' + esc(cur.stem) + '</div>';

    if (redone && e) {
      var lastTxt = isShort ? (e.last === cur.ans ? "会了" : "没记住")
                            : ('选的 <b>' + esc(fmtAns(e.last)) + '</b>');
      html += '<div class="hist">上次 ' + lastTxt + '（' +
        (e.ok ? "答对" : "答错") + '）· 做过 ' + e.n + ' 次，错过 ' + e.w +
        ' 次。这次重新做，历史会继续累加。</div>';
    }

    var ansSet = String(cur.ans).split("|");
    var mySet = done ? String(chosen).split("|") : [];
    if (!isShort) {
    html += '<div class="opts">';
    cur.opts.forEach(function(o){
      var cls = "opt";
      if (done) {
        if (ansSet.indexOf(o.k) >= 0) cls += " ok";
        else if (mySet.indexOf(o.k) >= 0) cls += " bad";
      }
      html += '<button class="' + cls + '" data-k="' + esc(o.k) + '"' + (done ? " disabled" : "") +
        '><b>' + esc(o.k) + '</b><span>' + esc(o.v) + '</span></button>';
    });
    html += '</div>';

    if (!done && isMulti) html += '<button class="submit" id="submit" disabled>提交答案</button>';
    }

    if (isShort && !done) {
      html += '<button class="submit" id="reveal">' + (revealed ? "收起参考答案" : "看参考答案") + '</button>';
    }
    if (isShort && revealed) {
      html += '<div class="exp"><div class="lbl">参考答案</div>' + esc(cur.ans) +
        (cur.exp ? '<div class="lbl">解析</div>' + esc(cur.exp) : '') + '</div>';
      if (!done) html += '<div class="opts">' +
        '<button class="opt" data-g="1"><b>✓</b><span>会了</span></button>' +
        '<button class="opt" data-g="0"><b>✗</b><span>没记住</span></button></div>';
    }

    if (done) {
      var right = chosen === cur.ans;
      if (isShort) {
        html += '<div class="exp"><div class="ans ' + (right ? "ok" : "bad") + '">' +
          (right ? "✓ 会了" : "✗ 没记住") + '</div>' +
          '<div class="lbl">参考答案</div>' + esc(cur.ans) +
          (cur.exp ? '<div class="lbl">解析</div>' + esc(cur.exp) : '') + '</div>';
      } else {
        html += '<div class="exp"><div class="ans ' + (right ? "ok" : "bad") + '">' +
          (right ? "✓ 答对了" : "✗ 答错了") + '　答案：' + esc(fmtAns(cur.ans)) + '</div>' +
          '<div class="lbl">解析</div>' + esc(cur.exp) + '</div>';
      }
    }
    if (e) {
      html += '<div class="hist">这题做过 <b>' + e.n + '</b> 次，错过 <b>' + e.w + '</b> 次' +
        '，连续答对 ' + (e.s || 0) + ' 次' + (e.wd ? '　最后答错：' + e.wd : '') +
        (e.w > 0 && (e.s || 0) >= 2 ? '　<span style="color:var(--ok)">已移出错题本（做错了还会回来）</span>' : '') +
        '</div>';
    }
    if (done || redone) html += '<button class="redoBtn" id="redoOne">重做这道题</button>';
    html += '</div>';
    app.innerHTML = html;

    if (!done) {
      if (isShort) {
        Array.prototype.forEach.call(app.querySelectorAll("[data-g]"), function(b){
          b.addEventListener("click", function(){
            var ok = b.getAttribute("data-g") === "1", q = cur;
            revealedId = null;
            record(q, ok ? q.ans : "__x__");
            render();
            if (ok && $("cAuto").classList.contains("on")) {
              setTimeout(function(){ if (pos < view.length - 1) { pos++; render(); } }, 700);
            }
          });
        });
      } else if (isMulti) bindMulti();
      else Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(b){
        b.addEventListener("click", function(){ choose(b.getAttribute("data-k")); });
      });
    }
    var rv = $("reveal");
    if (rv) rv.addEventListener("click", function(){
      revealedId = revealed ? null : id;
      render();
    });
    var rb = $("redoOne");
    if (rb) rb.addEventListener("click", function(){
      store.r[id] = 1;
      save(); render();
    });

    var answered = view.filter(function(q){ return !!recOf(q); }).length;
    var gotRight = view.filter(function(q){ var x = recOf(q); return x && x.ok; }).length;
    $("hdStat").textContent = "已做 " + answered + "/" + view.length +
      (answered ? "　全会率 " + pct(gotRight, answered) + "%" : "");
    var isFav = !!store.f[id];
    $("fav").classList.toggle("on", isFav);
    $("fav").textContent = isFav ? "★" : "☆";
    window.scrollTo(0, 0);
  }

  function bindMulti(){
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(b){
      b.addEventListener("click", function(){
        var k = b.getAttribute("data-k"), i = pending.indexOf(k);
        if (i >= 0) pending.splice(i, 1); else pending.push(k);
        b.classList.toggle("sel", i < 0);
        updSubmit();
      });
    });
    var s = $("submit");
    if (s) s.addEventListener("click", function(){
      if (!pending.length) return;
      choose(pending.slice().sort().join("|"));
    });
    updSubmit();
  }

  function updSubmit(){
    var s = $("submit");
    if (!s) return;
    s.disabled = pending.length === 0;
    s.textContent = pending.length ? "提交答案（已选 " + pending.length + "）" : "提交答案";
  }

  function choose(k){
    if (!cur || (!isFresh(cur) )) return;
    var q = cur;
    record(q, k);
    render();
    if ($("cAuto").classList.contains("on") && k === q.ans) {
      setTimeout(function(){ if (pos < view.length - 1) { pos++; render(); } }, 700);
    }
  }

  function go(step){
    if (!view.length) return;
    pos = (pos + step + view.length) % view.length;
    render();
  }

  // ---- 头部绑定 --------------------------------------------------------
  var years = [], chaps = [], seen = {};
  RAW.forEach(function(q){
    if (q.year && !seen["y"+q.year]) { seen["y"+q.year] = 1; years.push(q.year); }
    if (q.chap && !seen["c"+q.chap]) { seen["c"+q.chap] = 1; chaps.push(q.chap); }
  });
  years.sort(function(a,b){ return b.localeCompare(a); });
  chaps.sort(function(a,b){ return a.localeCompare(b, "zh"); });
  years.forEach(function(y){ $("selYear").insertAdjacentHTML("beforeend",
    '<option value="' + esc(y) + '">' + esc(y) + '年</option>'); });
  chaps.forEach(function(c){ $("selChap").insertAdjacentHTML("beforeend",
    '<option value="' + esc(c) + '">' + esc(c) + '</option>'); });

  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("fav").addEventListener("click", function(){
    if (!cur) return;
    if (store.f[cur.id]) delete store.f[cur.id]; else store.f[cur.id] = 1;
    save(); render();
  });
  ["selPart","selYear","selChap","selTime"].forEach(function(id){
    $(id).addEventListener("change", function(){
      if (id === "selPart") {
        var p = $("selPart").value;
        $("selYear").disabled = !(p === "全部" || p === "历年真题");
        $("selChap").disabled = !(p === "全部" || p === "章节题库");
      }
      applyFilter(null);
    });
  });
  ["cWrong","cFav","cShuf","cAuto"].forEach(function(id){
    $(id).addEventListener("click", function(){
      $(id).classList.toggle("on");
      if (id !== "cAuto") applyFilter(cur ? cur.id : null);
    });
  });
  $("cRedo").addEventListener("click", function(){
    if (!view.length) return;
    var n = view.filter(function(q){ return !isFresh(q); }).length;
    if (!n) { alert("当前范围里没有做过的题。"); return; }
    if (!confirm("把当前范围里的 " + n + " 道题标记成「重新做一遍」？\n作答题数 / 错误次数等历史都会保留。")) return;
    view.forEach(function(q){ store.r[q.id] = 1; });
    save();
    alert("已标记，从头开始刷吧。做完一题就自动取消这条标记。");
    pos = 0; render();
  });
  $("cClearView").addEventListener("click", function(){
    var n = view.filter(function(q){ return !!recOf(q); }).length;
    if (!n) { alert("当前范围里没有答题记录。"); return; }
    if (!confirm("删掉当前范围（共 " + view.length + " 题）里的 " + n + " 条答题记录？\n收藏会保留，但这个操作不能撤销。")) return;
    view.forEach(function(q){ delete store.h[q.id]; delete store.r[q.id]; });
    saveNow();
    if ($("cWrong").classList.contains("on")) $("cWrong").classList.remove("on");
    applyFilter(null);
  });

  // ---- 面板：答题卡 / 统计 / 备份 -------------------------------------
  var ov = $("panelOv"), grid = $("grid");
  function openPane(which){ ov.classList.remove("hide"); show(which); }
  function show(which){
    $("tabSheet").classList.toggle("on", which === "sheet");
    $("tabStat").classList.toggle("on", which === "stat");
    $("paneSheet").classList.toggle("hide", which !== "sheet");
    $("paneStat").classList.toggle("hide", which !== "stat");
    $("panelTitle").textContent = which === "sheet" ? "答题卡" : "统计 / 备份";
    if (which === "sheet") { $("panelStat").textContent = ""; buildSheet(); }
    else { $("panelStat").textContent = ""; buildStat(); }
  }
  $("panelBtn").addEventListener("click", function(){ openPane("sheet"); });
  $("tabSheet").addEventListener("click", function(){ show("sheet"); });
  $("tabStat").addEventListener("click", function(){ show("stat"); });
  $("panelClose").addEventListener("click", function(){ ov.classList.add("hide"); });
  ov.addEventListener("click", function(e){ if (e.target === ov) ov.classList.add("hide"); });

  function buildSheet(){
    var h = "";
    view.forEach(function(q, i){
      var c = "", x = recOf(q);
      if (x && !store.r[q.id]) c = (x.ok ? "ok" : "bad");
      if (store.f[q.id]) c += " fav";
      if (i === pos) c += " cur";
      h += '<button class="' + c + '" data-i="' + i + '">' + (i + 1) + '</button>';
    });
    grid.innerHTML = h || '<div class="empty" style="grid-column:1/-1">空的</div>';
    var answered = view.filter(function(q){ return !!recOf(q); }).length;
    $("panelStat").textContent = answered + "/" + view.length;
  }
  grid.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button[data-i]") : null;
    if (!b) return;
    pos = +b.getAttribute("data-i");
    ov.classList.add("hide");
    render();
  });

  function buildStat(){
    var pane = $("paneStat");
    var done = 0, lastRight = 0, tries = 0, tryRight = 0, open = 0, fixed = 0, startDay = "";
    var parts = {}, chaps = {};
    Object.keys(store.h).forEach(function(id){
      var e = store.h[id], q = byId[id];
      if (!q || !e) return;
      done++; tries += e.n; tryRight += (e.n - e.w);
      if (e.ok) lastRight++;
      if (e.w > 0) { if ((e.s || 0) >= 2) fixed++; else open++; }
      if (e.d && (!startDay || e.d < startDay)) startDay = e.d;
      var p = parts[q.part] || (parts[q.part] = {d:0, n:0, r:0});
      p.d++; p.n += e.n; p.r += (e.n - e.w);
      if ((e.s || 0) < 2 && e.w > 0 && q.chap) chaps[q.chap] = (chaps[q.chap] || 0) + 1;
    });
    var t = store.log[TODAY] || {n:0, w:0, d:0};

    var html = '<div class="kv">' +
      cell("总进度", done + '<small> / ' + TOTAL + '</small>', '<div class="prog"><i style="width:' + pct(done, TOTAL) + '%"></i></div>') +
      cell("累计正确率", pct(tryRight, tries) + "%", "共作答 " + tries + " 次") +
      cell("当前水平", pct(lastRight, done) + "%", "每题最后作答的对错") +
      cell("错题本", open + ' <small>道待清</small>', fixed ? "另有 " + fixed + " 道已连对 2 次移出" : "连对 2 次自动移出") +
      cell("今天", t.n + ' <small>题</small>', "对 " + t.d + "，错 " + t.w + "，正确率 " + pct(t.d, t.n) + "%") +
      cell("已刷天数", Object.keys(store.log).length + ' <small>天</small>', startDay ? "从 " + startDay + " 开始" : "还没开始") +
      '</div>';

    var arr = [], maxN = 1;
    for (var i = 6; i >= 0; i--) {
      var dk = dayFrom(i + 1), x = store.log[dk] || {n:0, d:0};
      arr.push({k:dk, n:x.n, ok:x.d});
      if (x.n > maxN) maxN = x.n;
    }
    html += '<div class="sec">近 7 天（柱上数字 = 当天题数）</div><div class="bars">';
    arr.forEach(function(a){
      html += '<div class="bar" title="' + a.k + '：' + a.n + ' 题，正确率 ' + pct(a.ok, a.n) + '%">' +
        '<b>' + (a.n || "") + '</b><div class="track"><i style="height:' +
        (a.n ? Math.max(Math.round(a.n / maxN * 100), 4) : 2) + '%"></i></div>' +
        '<span class="barlab">' + a.k.slice(5) + '</span></div>';
    });
    html += '</div>';

    var pk = Object.keys(parts).sort();
    if (pk.length) {
      html += '<div class="sec">按板块</div><table class="tb">';
      pk.forEach(function(p){
        var x = parts[p];
        html += "<tr><td>" + esc(p) + "</td><td>" + x.d + " 题已做　正确率 " + pct(x.r, x.n) + "%</td></tr>";
      });
      html += "</table>";
    }
    var ck = Object.keys(chaps).sort(function(a,b){ return chaps[b] - chaps[a]; }).slice(0, 8);
    if (ck.length) {
      html += '<div class="sec">错题最多的章节</div><table class="tb">';
      ck.forEach(function(c){
        html += "<tr><td>" + esc(c) + "</td><td>" + chaps[c] + " 道未清</td></tr>";
      });
      html += "</table>";
    }

    html += '<div class="acts">' +
      '<button id="btnExport">导出备份</button>' +
      '<button id="btnImport">导入备份</button>' +
      '<button class="danger" id="btnWipe">清空全部记录</button></div>' +
      '<div class="pad">记录只存在这台设备的浏览器里，刷久了建议偶尔点一下「导出备份」存个文件；换手机或清缓存时用「导入备份」恢复。</div>';

    pane.innerHTML = html;

    $("btnExport").addEventListener("click", exportBackup);
    $("btnImport").addEventListener("click", function(){ $("impFile").click(); });
    $("btnWipe").addEventListener("click", function(){
      var n = Object.keys(store.h).length;
      if (!n) { alert("本来就是空的。"); return; }
      if (!confirm("清空全部记录？\n会删掉 " + n + " 道题的作答记录、" + Object.keys(store.f).length +
        " 条收藏和所有每日统计，不能撤销。\n\n（只想清部分，请回到题目页用「清空本范围记录」。建议先导出备份。）")) return;
      if (!confirm("再确认一次：真的要清空吗？")) return;
      store = blank(); saveNow(); buildStat(); applyFilter(null);
    });
  }

  function cell(label, big, sub){
    return '<div class="cell"><div class="n">' + big + '</div><div class="l">' + label +
      (sub ? '　' + sub : "") + '</div></div>';
  }

  function exportBackup(){
    var payload = {type: "pp_eco_progress", v: 2, at: new Date().toISOString(), data: store};
    var blob = new Blob([JSON.stringify(payload)], {type: "application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "案例分析刷题记录-" + TODAY + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  $("impFile").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var obj = null;
      try { obj = JSON.parse(fr.result); } catch(e){ alert("这个文件读不出来，不是备份文件？"); return; }
      var d = obj && obj.data ? obj.data : obj;
      if (!d || typeof d !== "object" || !d.h) { alert("这个文件里没有刷题记录。"); return; }
      var n = Object.keys(d.h).length;
      if (!confirm("导入 " + n + " 道题的记录？\n会覆盖这台设备上现有的记录（建议先导出备份）。")) return;
      store = {v:2, h:d.h, f:d.f || {}, r:d.r || {}, log:d.log || {}};
      saveNow();
      buildStat();
      applyFilter(null);
      alert("导入完成。");
    };
    fr.readAsText(f);
    this.value = "";
  });

  // ---- 键盘 ------------------------------------------------------------
  document.addEventListener("keydown", function(e){
    if (/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || ""))) return;
    if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "ArrowRight") go(1);
    else if (/^[a-eA-E]$/.test(e.key) && cur && !store.h[cur.id]) choose(e.key.toUpperCase());
    else if (/^[1-6]$/.test(e.key) && cur && !store.h[cur.id] && cur.opts[+e.key - 1])
      choose(cur.opts[+e.key - 1].k);
  });

  // ---- 启动 ------------------------------------------------------------
  $("hdTitle").textContent = "价格鉴证案例分析";
  applyFilter(null);
})();
</script>
<script>
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>
</body>
